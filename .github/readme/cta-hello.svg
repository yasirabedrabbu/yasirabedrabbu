<svg xmlns="http://www.w3.org/2000/svg" width="260" height="64" viewBox="0 0 260 64" role="img" aria-label="Say hello"><title>Say hello</title><style>text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.08,1.3)}}.shine{animation:sh 3.6s ease-in-out infinite}@keyframes sh{0%{transform:skewX(-20deg) translateX(0)}55%,100%{transform:skewX(-20deg) translateX(360px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="c"><rect x="6" y="6" width="248" height="52" rx="26"/></clipPath></defs>
<rect class="ring" x="6" y="6" width="248" height="52" rx="26" fill="none" stroke="#c9a24b" stroke-width="2"/>
<rect x="6" y="6" width="248" height="52" rx="26" fill="#1f1f24" stroke="#c9a24b" stroke-opacity="0.7" stroke-width="1.5"/>
<g clip-path="url(#c)"><rect class="shine" x="-60" y="0" width="40" height="64" fill="#c9a24b" fill-opacity=".35" transform="skewX(-20)"/></g>
<text x="130" y="38" font-size="16" font-weight="700" fill="#c9a24b" text-anchor="middle">Say hello  &#8594;</text></svg>
