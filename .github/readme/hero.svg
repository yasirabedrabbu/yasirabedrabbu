<rect x="46" y="134" width="590" height="68" fill="none" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="6 5"/>
<g fill="#1f1f24" stroke="#c9a24b" stroke-width="1.5"><rect x="42" y="130" width="8" height="8"/><rect x="632" y="130" width="8" height="8"/><rect x="42" y="198" width="8" height="8"/><rect x="632" y="198" width="8" height="8"/></g>
<rect x="558" y="208" width="78" height="20" rx="4" fill="#c9a24b"/><text class="mono" x="597" y="222" font-size="11" font-weight="700" fill="#1f1f24" text-anchor="middle">590 &#215; 68</text>
</g>
<text class="sub s1" x="56" y="250" font-size="18" fill="#f6efe6" fill-opacity=".8">I design products people understand instantly.</text><text class="sub s2" x="56" y="250" font-size="18" fill="#f6efe6" fill-opacity=".8">Complex SaaS, healthcare &amp; fintech flows, made simple.</text><text class="sub s3" x="56" y="250" font-size="18" fill="#f6efe6" fill-opacity=".8">Design systems, prototypes and developer-ready handoff.</text><text class="sub s4" x="56" y="250" font-size="18" fill="#f6efe6" fill-opacity=".8">Senior Executive, UI/UX Designer at Backbencher Studio.</text>
<g class="chip" style="animation-delay:1.20s"><rect x="56" y="276" width="63" height="30" rx="15" fill="#6b1a2b"/><text x="88" y="296" font-size="13" font-weight="600" fill="#f6efe6" text-anchor="middle">SaaS</text></g><g class="chip" style="animation-delay:1.40s"><rect x="129.2" y="276" width="110" height="30" rx="15" fill="#6b1a2b"/><text x="184" y="296" font-size="13" font-weight="600" fill="#f6efe6" text-anchor="middle">Healthcare</text></g><g class="chip" style="animation-delay:1.30s"><rect x="249.2" y="276" width="87" height="30" rx="15" fill="#6b1a2b"/><text x="292" y="296" font-size="13" font-weight="600" fill="#f6efe6" text-anchor="middle">FinTech</text></g>
<text class="in" style="animation-delay:1.5s" x="354" y="296" font-size="13" fill="#f6efe6" fill-opacity=".55">Dhaka &#183; GMT+6</text>
<g transform="translate(775 170)">
