<rect x="56" y="38" width="262" height="30" rx="15" fill="#f6efe6" fill-opacity=".06" stroke="#f6efe6" stroke-opacity=".14"/>
<circle class="ping" cx="74" cy="53" r="4" fill="#34d399"/><circle cx="74" cy="53" r="4" fill="#10b981"/>
<text x="88" y="57.5" font-size="11" font-weight="700" letter-spacing="1.6" fill="#f6efe6" fill-opacity=".85">OPEN TO REMOTE ROLES WORLDWIDE</text>
</g>
<text class="in" style="animation-delay:.25s" x="56" y="118" font-size="13" font-weight="700" letter-spacing="3" fill="#c9a24b">HELLO, I&#8217;M</text>
<g class="in" style="animation-delay:.4s">
<text x="58" y="186" font-size="62" font-weight="800" fill="#f6efe6" textLength="548" lengthAdjust="spacingAndGlyphs">Yasir Abed Rabbu</text><circle cx="620" cy="180" r="6" fill="#c9a24b"/>
</g>
