<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
<title id="t">Yasir Abed Rabbu</title>
<desc id="d">Animated banner: Product designer for SaaS, healthcare and fintech, with a Figma-style selection box around the name.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090913"/><stop offset="1" stop-color="#1b1033"/></linearGradient>
<linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="620" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#f0abfc"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;1120 0" dur="10s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="clip"><rect width="900" height="340" rx="20"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif}
.sub{opacity:0;animation:cyc 12s infinite both}
.s1{animation-delay:0s}.s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}26%,100%{opacity:0;transform:translateY(-10px)}}
</style>
<g clip-path="url(#clip)">
<rect width="900" height="340" fill="url(#bg)"/>
<rect width="900" height="340" fill="url(#grid)"/>
<g filter="url(#blur)">
<circle cx="150" cy="80" r="110" fill="#7c3aed" opacity=".55"><animateTransform attributeName="transform" type="translate" values="0 0;90 60;0 0" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="260" r="130" fill="#0ea5e9" opacity=".4"><animateTransform attributeName="transform" type="translate" values="0 0;-110 -50;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="520" cy="40" r="80" fill="#ec4899" opacity=".35"><animateTransform attributeName="transform" type="translate" values="0 0;-60 90;0 0" dur="16s" repeatCount="indefinite"/></circle>
</g>

<!-- floating UI cards -->
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/>
<rect x="700" y="60" width="150" height="96" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
<circle cx="724" cy="84" r="10" fill="#a78bfa"/>
<rect x="742" y="76" width="64" height="7" rx="3.5" fill="#ffffff" fill-opacity=".35"/>
<rect x="742" y="89" width="40" height="6" rx="3" fill="#ffffff" fill-opacity=".18"/>
<rect x="714" y="110" width="122" height="6" rx="3" fill="#ffffff" fill-opacity=".14"/>
<rect x="714" y="124" width="84" height="22" rx="11" fill="#7c3aed"/>
<rect x="722" y="132" width="40" height="6" rx="3" fill="#ffffff" fill-opacity=".85"/>
</g>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="6.5s" repeatCount="indefinite"/>
<rect x="640" y="196" width="150" height="90" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
<polyline points="656,262 680,244 704,252 728,224 752,236 774,214" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/></polyline>
<rect x="656" y="210" width="54" height="6" rx="3" fill="#ffffff" fill-opacity=".3"/>
</g>

<!-- orbiting shapes -->
<g fill="none" stroke-width="1.5">
<circle cx="610" cy="60" r="16" stroke="#f0abfc" stroke-opacity=".7" stroke-dasharray="4 5"><animateTransform attributeName="transform" type="rotate" values="0 610 60;360 610 60" dur="9s" repeatCount="indefinite"/></circle>
<rect x="866" y="190" width="18" height="18" rx="3" stroke="#67e8f9" stroke-opacity=".7"><animateTransform attributeName="transform" type="rotate" values="0 875 199;360 875 199" dur="11s" repeatCount="indefinite"/></rect>
<polygon points="585,300 597,320 573,320" stroke="#a78bfa" stroke-opacity=".7"><animateTransform attributeName="transform" type="rotate" values="0 585 311;-360 585 311" dur="13s" repeatCount="indefinite"/></polygon>
</g>

<!-- eyebrow -->
<text x="60" y="88" font-size="13" font-weight="700" letter-spacing="5" fill="#a78bfa">HELLO, I'M</text>

<!-- name + figma selection -->
<text x="60" y="170" font-size="60" font-weight="800" fill="url(#ink)" textLength="560" lengthAdjust="spacingAndGlyphs">Yasir Abed Rabbu</text>
<rect x="44" y="104" width="592" height="86" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/></rect>
<g fill="#090913" stroke="#a78bfa" stroke-width="1.5">
<rect x="40" y="100" width="8" height="8"/><rect x="632" y="100" width="8" height="8"/>
<rect x="40" y="186" width="8" height="8"/><rect x="632" y="186" width="8" height="8"/>
</g>
<rect x="294" y="198" width="92" height="20" rx="10" fill="#7c3aed"/>
<text x="340" y="212" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">592 × 86</text>

<!-- cycling subtitle -->
<g>
<text class="sub s1" x="60" y="258" font-size="22" fill="#e5e7eb">I design products people understand instantly.</text>
<text class="sub s2" x="60" y="258" font-size="22" fill="#e5e7eb">I ship to production, not just to Figma.</text>
<text class="sub s3" x="60" y="258" font-size="22" fill="#e5e7eb">Design systems, prototypes and real code.</text>
<text class="sub s4" x="60" y="258" font-size="22" fill="#e5e7eb">Senior UI/UX Designer at Backbencher Studio.</text>
</g>

<!-- chips -->
<g font-size="13" fill="#d1d5db" text-anchor="middle">
<rect x="60" y="284" width="64" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="92" y="303">SaaS</text>
<rect x="134" y="284" width="104" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="186" y="303">Healthcare</text>
<rect x="248" y="284" width="78" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14"/><text x="287" y="303">FinTech</text>
</g>
<rect x="340" y="284" width="196" height="28" rx="14" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".35"/>
<circle cx="360" cy="298" r="4" fill="#34d399"/>
<circle cx="360" cy="298" r="4" fill="none" stroke="#34d399"><animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="374" y="303" font-size="13" fill="#a7f3d0">Open to collaborations</text>

<!-- designer cursor -->
<g>
<animateMotion dur="11s" repeatCount="indefinite" path="M560 60 C640 20 760 120 700 190 S520 250 560 60" rotate="0"/>
<path d="M0 0 L0 17 L4.6 12.6 L7.8 20 L10.6 18.8 L7.4 11.4 L13.4 11.4 Z" fill="#a78bfa" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="12" y="18" width="46" height="18" rx="9" fill="#a78bfa"/>
<text x="35" y="31" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Yasir</text>
</g>
</g>
<rect x=".5" y=".5" width="899" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
