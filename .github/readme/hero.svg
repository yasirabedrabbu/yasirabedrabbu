<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Yasir Abed Rabbu, Senior Executive UI/UX Designer for SaaS, healthcare and fintech"><title>Yasir Abed Rabbu, Senior Executive UI/UX Designer for SaaS, healthcare and fintech</title><style>text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.in{opacity:0;animation:in .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chip{opacity:0;animation:in .8s cubic-bezier(.16,1,.3,1) 1.2s forwards}
.sel{opacity:0;animation:sel 1s ease .9s forwards}@keyframes sel{to{opacity:1}}
.sub{opacity:0;animation:cyc 16s infinite both}.s1{animation-delay:1s}.s2{animation-delay:5s}.s3{animation-delay:9s}.s4{animation-delay:13s}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}@keyframes ping{to{transform:scale(3);opacity:0}}
.spin{transform-box:view-box;animation:spin 40s linear infinite}.spin2{animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop 1s cubic-bezier(.34,1.56,.64,1) .5s forwards}@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-10deg)}to{opacity:1;transform:none}}
.drift{animation:drift 14s ease-in-out infinite alternate}.drift2{animation:drift 10s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,40px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f6efe6" stroke-opacity=".04"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="clip"><rect width="900" height="360" rx="24"/></clipPath>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6b1a2b"/><stop offset=".5" stop-color="#c9a24b"/><stop offset="1" stop-color="#6b1a2b"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
<rect width="900" height="360" fill="#1f1f24"/><rect width="900" height="360" fill="url(#grid)"/>
<circle class="drift" cx="760" cy="70" r="170" fill="#6b1a2b" opacity=".85" filter="url(#blur)"/>
<circle class="drift2" cx="830" cy="330" r="110" fill="#c9a24b" opacity=".22" filter="url(#blur)"/>
<rect y="354" width="900" height="6" fill="url(#bar)"/>
</g>
<rect x=".5" y=".5" width="899" height="359" rx="23.5" fill="none" stroke="#f6efe6" stroke-opacity=".08"/>
