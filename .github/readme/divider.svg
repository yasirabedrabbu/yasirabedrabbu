<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" role="img" aria-label="Decorative divider"><title>Decorative divider</title><style>text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}@keyframes run{from{transform:translateX(40px)}to{transform:translateX(860px)}}.run{animation:run 7s ease-in-out infinite alternate}.rot{animation:rot 8s linear infinite}@keyframes rot{from{transform:rotate(45deg)}to{transform:rotate(405deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="l" gradientUnits="userSpaceOnUse" x1="40" x2="860"><stop offset="0" stop-color="#c9a24b" stop-opacity="0"/><stop offset=".5" stop-color="#c9a24b"/><stop offset="1" stop-color="#c9a24b" stop-opacity="0"/></linearGradient></defs>
<line x1="40" y1="14" x2="860" y2="14" stroke="url(#l)" stroke-width="1.5"/>
<circle class="run" cy="14" r="10" fill="#c9a24b" opacity=".18"/><circle class="run" cy="14" r="3.5" fill="#c9a24b"/>
<g transform="translate(450 14)"><rect class="rot" x="-7" y="-7" width="14" height="14" rx="2" fill="#6b1a2b" stroke="#c9a24b" stroke-width="1.5"/></g></svg>
