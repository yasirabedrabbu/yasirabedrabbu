<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="Mutual Interest Casting Platform"><title>Mutual Interest Casting Platform</title><style>text{font-family:'Segoe UI Variable Display','Segoe UI','SF Pro Display',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}@keyframes ping{to{transform:scale(3);opacity:0}}.breathe{animation:br 5s ease-in-out infinite alternate}@keyframes br{to{opacity:.55}}.sweep{animation:sw 4.5s cubic-bezier(.65,0,.35,1) infinite}@keyframes sw{to{transform:translateX(680px)}}.nudge{animation:nd 1.6s ease-in-out infinite}@keyframes nd{50%{transform:translate(2px,-2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
